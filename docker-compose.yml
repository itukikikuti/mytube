services:
  backend:
    build:
      context: ./backend
    ports:
      - "8081:8080"
    environment:
      VIDEO_DIR: /videos
      DB_PATH: /data/db.sqlite
    volumes:
      - /mnt/nas/Videos:/videos:ro
      - ./data:/data:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
