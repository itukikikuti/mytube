version: '3.8'
services:
  nextjs:
    build:
      context: https://github.com/itukikikuti/mytube.git#web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/db.sqlite
      - NODE_OPTIONS=--max-old-space-size=2048 --expose-gc
      - NODE_PRESERVE_SYMLINKS=1
    restart: always
    volumes:
      - /mnt/nas:/app/nas
      - /home/ubuntu/mytube/data:/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
