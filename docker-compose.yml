services:
  backend:
    build:
      context: ./backend
    container_name: mytube-backend
    ports:
      - "8081:8080"
    environment:
      VIDEO_DIR: /videos
    volumes:
      - /mnt/nas/Videos:/videos:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: mytube-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
