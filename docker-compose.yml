services:
  mytube:
    build: .
    ports:
      - "3332:3000"
    environment:
      - PORT=3000
      - TZ=Asia/Tokyo
    volumes:
      - ./data:/app/data
      - nasvideos:/app/videos
    restart: unless-stopped

volumes:
  # NAS を Docker 自身に CIFS マウントさせる。
  # ホストの /mnt/nas は fstab に無く再起動で消えるため、そこには依存しない。
  # DB 本体はローカルの ./data に置き、NAS 上で SQLite を開かないので nobrl は不要。
  nasvideos:
    driver: local
    driver_opts:
      type: cifs
      device: "//10.0.0.141/Share/Videos"
      o: "username=${NAS_USER},password=${NAS_PASS},vers=3.1.1,uid=1000,gid=1000,forceuid,forcegid,file_mode=0644,dir_mode=0755,iocharset=utf8,soft,actimeo=1"
