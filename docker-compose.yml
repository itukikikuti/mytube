version: '3.8'
services:
  nextjs:
    build:
      context: https://github.com/itukikikuti/mytube.git#nextjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/db.sqlite
    restart: always
    volumes:
      - /mnt/nas/Videos:/app/public/videos
      - /home/ubuntu/mytube/data:/data