<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/lucide@0.468.0"></script>
  </head>
  <body>
    <dialog id="media-modal">
      <button id="media-modal-close" type="button" aria-label="閉じる"><i data-lucide="x"></i></button>
      <div id="media-modal-body">
        <div id="player-wrapper">
          <video id="media-player" loop></video>
          <img id="media-image" alt="">
          <iframe id="media-book" title="PDF"></iframe>
          <div id="player-controls">
            <div id="player-controls-bar">
              <button id="player-play-btn" type="button" aria-label="再生/停止" data-state="paused">
                <i data-lucide="play" class="icon-play"></i>
                <i data-lucide="pause" class="icon-pause"></i>
              </button>
              <span id="player-time">0:00 / 0:00</span>
              <input id="player-seekbar" type="range" min="0" max="1000" step="1" value="0">
              <button id="player-fullscreen-btn" type="button" aria-label="フルスクリーン" data-state="normal">
                <i data-lucide="maximize" class="icon-maximize"></i>
                <i data-lucide="minimize" class="icon-minimize"></i>
              </button>
            </div>
          </div>
        </div>
        <aside id="media-modal-sidebar">
          <dl id="media-modal-meta">
            <div><dt><i data-lucide="calendar-days"></i>日時</dt><dd id="media-modal-date"></dd></div>
            <div><dt><i data-lucide="captions"></i>タイトル</dt><dd id="media-modal-title"></dd></div>
            <div><dt><i data-lucide="clock-3"></i>長さ</dt><dd id="media-modal-duration"></dd></div>
            <div><dt><i data-lucide="hard-drive"></i>サイズ</dt><dd id="media-modal-size"></dd></div>
            <div><dt><i data-lucide="play"></i>再生回数</dt><dd id="media-modal-play-count"></dd></div>
            <div><dt><i data-lucide="heart"></i>評価</dt><dd id="media-modal-rate"></dd></div>
          </dl>
          <button id="media-modal-play-local" type="button"><i data-lucide="external-link"></i>ローカルで再生</button>
          <div id="media-modal-thumbs"></div>
        </aside>
      </div>
    </dialog>

    <header id="media-header">
      <div id="header-bar">
        <input type="search" id="search-input" name="q" placeholder="検索">
        <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="header-filters">
          <i data-lucide="sliders-horizontal"></i><span>絞り込み</span>
        </button>
      </div>
      <div id="header-filters">
        <select id="sort-select" name="sort">
          <option value="date_desc">新しい順</option>
          <option value="date_asc">古い順</option>
          <option value="recent">最近再生した順</option>
          <option value="duration_desc">長い順</option>
          <option value="duration_asc">短い順</option>
          <option value="size_desc">大きい順</option>
          <option value="size_asc">小さい順</option>
          <option value="rate_desc">レート高い順</option>
          <option value="play_count">再生回数順</option>
          <option value="shuffle">シャッフル</option>
          <option value="title">タイトル順</option>
          <option value="id">ID順</option>
        </select>
        <fieldset id="type-filter">
          <label><input type="checkbox" name="type" value="video" checked> 動画</label>
          <label><input type="checkbox" name="type" value="image"> 画像</label>
          <label><input type="checkbox" name="type" value="anime"> GIF</label>
          <label><input type="checkbox" name="type" value="book"> PDF</label>
        </fieldset>
        <fieldset id="rate-filter">
          <label><input type="checkbox" name="rate" value="0" checked> 0</label>
          <label><input type="checkbox" name="rate" value="1" checked> 1</label>
          <label><input type="checkbox" name="rate" value="2" checked> 2</label>
          <label><input type="checkbox" name="rate" value="3" checked> 3</label>
          <label><input type="checkbox" name="rate" value="4" checked> 4</label>
          <label><input type="checkbox" name="rate" value="5" checked> 5</label>
        </fieldset>
        <button type="button" id="apply-button"
          hx-get="/medias"
          hx-target="#media-list"
          hx-include="#media-header">適用</button>
      </div>
      <div id="media-count"></div>
    </header>

    <div id="media-list" hx-get="/medias" hx-include="#media-header" hx-trigger="load"></div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
