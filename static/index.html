<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyTube</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <dialog id="media-modal">
      <button id="media-modal-close" type="button" aria-label="閉じる">×</button>
      <div id="media-modal-body">
        <video id="media-player" controls></video>
        <aside id="media-modal-sidebar">
          <dl id="media-modal-meta">
            <div><dt>日時</dt><dd id="media-modal-date"></dd></div>
            <div><dt>タイトル</dt><dd id="media-modal-title"></dd></div>
            <div><dt>長さ</dt><dd id="media-modal-duration"></dd></div>
            <div><dt>評価</dt><dd id="media-modal-rate"></dd></div>
          </dl>
          <div id="media-modal-thumbs"></div>
        </aside>
      </div>
    </dialog>

    <div id="media-list" hx-get="/medias" hx-trigger="load"></div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
