<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyTube</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <dialog id="media-modal">
      <button id="media-modal-close" type="button" aria-label="閉じる">×</button>
      <video id="media-player" controls></video>
    </dialog>

    <div id="media-list" hx-get="/medias" hx-trigger="load"></div>

    <script>
      const mediaModal = document.getElementById('media-modal');
      const mediaModalClose = document.getElementById('media-modal-close');
      const mediaPlayer = document.getElementById('media-player');
      const mediaList = document.getElementById('media-list');
      const mediaRequests = new WeakMap();

      // メディア枠が画面に入ったら詳細HTMLを読み込み、画面外へ出たら中身を捨てる。
      const intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            loadMedia(entry.target);
          } else {
            // 画面外へ出た枠の読み込みが残っていれば中断する。
            const controller = mediaRequests.get(entry.target);
            if (controller) {
              controller.abort();
              mediaRequests.delete(entry.target);
            }

            entry.target.innerHTML = '';
            entry.target.removeAttribute('data-loaded');
            entry.target.removeAttribute('data-loading');
          }
        });
      }, { threshold: 0 });

      async function loadMedia(target) {
        const mediaId = target.dataset.mediaId;

        // IDなし、読み込み中、読み込み済みの枠は何もしない。
        if (!mediaId || target.dataset.loading === 'true' || target.dataset.loaded === 'true') {
          return;
        }

        // AbortControllerをWeakMapに持たせ、画面外へ出た時にfetchを止められるようにする。
        const controller = new AbortController();
        mediaRequests.set(target, controller);
        target.dataset.loading = 'true';

        try {
          const response = await fetch(`/medias/${encodeURIComponent(mediaId)}`, {
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`Failed to fetch media ${mediaId}`);
          }

          const html = await response.text();
          if (controller.signal.aborted) {
            return;
          }

          // /medias/:id が返したHTMLを、そのまま対象の枠へ差し込む。
          target.innerHTML = html;
          target.dataset.loaded = 'true';
        } catch (error) {
          if (error.name !== 'AbortError') {
            console.error(error);
          }
        } finally {
          if (mediaRequests.get(target) === controller) {
            mediaRequests.delete(target);
            target.removeAttribute('data-loading');
          }
        }
      }

      function observeListItems() {
        mediaList.querySelectorAll('[data-media-id]').forEach(target => {
          intersectionObserver.observe(target);
        });
      }

      // htmxが /medias の一覧HTMLを差し込んだ後、新しく増えた枠も監視対象にする。
      observeListItems();
      mediaList.addEventListener('htmx:afterSwap', observeListItems);

      window.setInterval(() => {
        document.querySelectorAll('.media-item-thumb-track').forEach(track => {
          const thumb = track.closest('.media-item-thumb');
          const thumbCount = track.children.length;
          if (!thumb || thumbCount <= 1) return;

          const currentThumbIndex = ((Number(thumb.dataset.thumbIndex) || 0) + 1) % thumbCount;
          thumb.dataset.thumbIndex = String(currentThumbIndex);
          track.style.transform = `translateX(${-currentThumbIndex * 100}%)`;
          thumb.querySelectorAll('.media-item-thumb-indicator').forEach((indicator, indicatorIndex) => {
            indicator.classList.toggle('is-active', indicatorIndex === currentThumbIndex);
          });
        });
      }, 1800);

      function playVideo(src) {
        mediaPlayer.src = src;
        mediaModal.showModal();
        mediaPlayer.play();
      }

      mediaModalClose.addEventListener('click', () => mediaModal.close());
      mediaModal.addEventListener('close', () => {
        mediaPlayer.pause();
        mediaPlayer.removeAttribute('src');
        mediaPlayer.load();
      });
    </script>
  </body>
</html>
